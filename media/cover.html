<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#F4EDE1;font-family:"Public Sans",sans-serif;color:#181410;
    display:flex;flex-direction:column;justify-content:center;padding:0 88px;position:relative;overflow:hidden}
  .stripe{position:absolute;top:0;left:0;right:0;height:14px;background:#D16211}
  .mark{font-family:"Fraunces",serif;font-size:44px;font-weight:700;letter-spacing:-.02em;margin-bottom:36px}
  .mark span{color:#1E5FA8}
  h1{font-family:"Fraunces",serif;font-size:76px;font-weight:700;line-height:1.04;letter-spacing:-.03em;max-width:16ch}
  p{font-size:26px;color:#4E463A;margin-top:28px;max-width:44ch;line-height:1.45}
  .foot{position:absolute;bottom:52px;left:88px;right:88px;display:flex;justify-content:space-between;
    align-items:center;font-size:18px;color:#4E463A;border-top:2px solid #D2C4A8;padding-top:24px}
  .foot b{color:#181410}
  .pill{background:#1E5FA8;color:#FFFCF5;padding:9px 20px;border-radius:999px;font-weight:600;font-size:17px}
  .glyph{position:absolute;right:-60px;top:96px;width:420px;height:420px;opacity:.13}
</style>
</head>
<body>
  <div class="stripe"></div>
  <svg class="glyph" viewBox="0 0 100 100" fill="none" stroke="#1E5FA8" stroke-width="5" stroke-linecap="round">
    <path d="M12 74c16 10 60 10 76 0M12 50c16 10 60 10 76 0M12 26c16 10 60 10 76 0"/>
  </svg>
  <div class="mark">Su<span>su</span></div>
  <h1>The box everybody can see into.</h1>
  <p>A group savings box on Ethereum where members never touch crypto. Sign in with your phone number, see cedis, tap an amount.</p>
  <div class="foot">
    <span><b>EAG Ghana Hackathon 2026</b> · Ghana Track · Kumasi</span>
    <span class="pill">No wallet. No fees. No seed phrase.</span>
  </div>
</body>
</html>
